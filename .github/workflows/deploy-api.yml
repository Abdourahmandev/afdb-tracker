# .github/workflows/deploy-api.yml
# Lint, test, and deploy the AfDB-Platform API (FastAPI on Azure Functions v2)
# to the dev Function App whenever relevant source files change on the DEV branch.
#
# Triggers: push to DEV branch, path filter covers API + pipeline + scraper code
#
# Required secrets:
#   AZURE_FUNCTIONAPP_PUBLISH_PROFILE  — download from Azure Portal:
#     Function App → Overview → "Get publish profile"
#     Store in: GitHub → Settings → Secrets and variables → Actions
#
# Required repository variables (Settings → Variables → Actions):
#   AZURE_FUNCTION_APP_NAME  — e.g. func-afdb-dev
#     Set via: gh variable set AZURE_FUNCTION_APP_NAME --body "func-afdb-dev"
#
# Gate: the deploy step only runs when tests pass (needs: [test]).
# scm-do-build-during-deployment: false because we pre-install deps in CI
# and upload the .python_packages/ folder as part of the package.

name: Deploy — Azure Functions API (DEV)

on:
  push:
    branches:
      - DEV
    paths:
      - "api/**"
      - "src/**"
      - "scrapers/**"
      - "requirements.txt"

# Prevent concurrent deployments; do not cancel in-progress deploys
concurrency:
  group: functions-deploy-dev
  cancel-in-progress: false

jobs:
  # ─── Job 1: Install, lint, test ──────────────────────────────────────────────
  test:
    name: Install dependencies and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # Install into system Python for tests, and into .python_packages for the deploy package.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      # Docker build sanity check (legacy pipeline requirement — runs on every pipeline)
      - name: Docker build sanity check
        run: |
          if [ -f Dockerfile ]; then
            docker build --no-cache --target build -t afdb-sanity-check . 2>&1 | tail -5 || \
            docker build --no-cache -t afdb-sanity-check . 2>&1 | tail -5
            echo "Docker build sanity check passed."
          else
            echo "No Dockerfile found — skipping docker build check."
          fi

      # SKIP_AUTH=true activates the mock identity path in api/auth.py so tests
      # do not need a live Entra tenant. Cosmos DB calls are mocked in test_api.py.
      - name: Run test suite
        env:
          SKIP_AUTH: "true"
          DEV_USER_EMAIL: "ci-runner@example.com"
          # Prevent any accidental outbound calls during tests
          COSMOS_ENDPOINT: "https://cosmos-afdb-dev.documents.azure.com:443/"
          COSMOS_DATABASE: "afdb-dev"
        run: |
          python -m pytest tests/ -v --tb=short

  # ─── Job 2: Deploy to Azure Functions ────────────────────────────────────────
  deploy:
    name: Deploy to func-afdb-dev
    runs-on: ubuntu-latest
    # Hard gate: only runs when the test job succeeds
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # Re-install into .python_packages for the deployment package.
      # The test job's .python_packages is not shared between jobs.
      - name: Install dependencies into .python_packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          slot-name: production
          package: .
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          # Dependencies are already in .python_packages — no remote build needed
          scm-do-build-during-deployment: false
