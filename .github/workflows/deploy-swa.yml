# .github/workflows/deploy-swa.yml
# Deploy the AfDB-Platform frontend (vanilla JS) to Azure Static Web Apps.
#
# Triggers:
#   - push to DEV branch touching frontend/**  → deploy preview/dev environment
#   - pull_request_closed targeting DEV        → close the SWA preview environment
#
# Required secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN_DEV  — deployment token from swa-afdb-dev
#     Obtain via: az staticwebapp secrets list --name swa-afdb-dev --query "properties.apiKey"
#     Store in: GitHub → Settings → Secrets and variables → Actions
#
# Required repo variables (not secrets):
#   none — all config is baked into the SWA app settings via Bicep

name: Deploy — Static Web App (DEV)

on:
  push:
    branches:
      - DEV
    paths:
      - "frontend/**"

  pull_request:
    types:
      - closed
    branches:
      - DEV

# Prevent concurrent deployments to the same environment
concurrency:
  group: swa-deploy-dev
  cancel-in-progress: false   # Do not cancel in-progress; queue instead

jobs:
  # ─── Job 1: Deploy on push ───────────────────────────────────────────────────
  deploy:
    name: Upload to Static Web Apps (DEV)
    runs-on: ubuntu-latest
    # Only runs on push events — not on PR closed events
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # Docker build sanity check (legacy pipeline requirement — runs on every pipeline)
      - name: Docker build sanity check
        run: |
          if [ -f Dockerfile ]; then
            docker build --no-cache --target build -t afdb-sanity-check . 2>&1 | tail -5 || \
            docker build --no-cache -t afdb-sanity-check . 2>&1 | tail -5
            echo "Docker build sanity check passed."
          else
            echo "No Dockerfile found — skipping docker build check."
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          # No Node.js build step — vanilla JS, served as-is
          skip_app_build: true
          output_location: ""

  # ─── Job 2: Close preview environment on PR close ────────────────────────────
  close_pull_request:
    name: Close SWA Preview Environment
    runs-on: ubuntu-latest
    # Standard SWA pattern: clean up preview env when a PR is closed
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Close SWA preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: "close"
